# Local development only. Not a production topology (see docs/project-record/deployment-record.md).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-gcare_hms_dev}
      POSTGRES_USER: ${DB_USERNAME:-gcare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gcare}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # bound to localhost only
    volumes:
      - gcare-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gcare-pgdata:
