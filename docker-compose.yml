# Local development only. Not a production topology (see docs/project-record/deployment-record.md).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-gcare_hms_dev}
      POSTGRES_USER: ${DB_USERNAME:-gcare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gcare}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # bound to localhost only
    volumes:
      - gcare-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider (OD-03, ADR-012). Dev mode with its own throwaway storage and the synthetic
  # realm in infra/keycloak. Production Keycloak runs in production mode with its own database and TLS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080" # bound to localhost only
    volumes:
      - ./infra/keycloak/gcare-realm.local.json:/opt/keycloak/data/import/gcare-realm.json:ro
      - ./infra/keycloak/themes/gcare:/opt/keycloak/themes/gcare:ro # GCare sign-in look

  # Imaging archive for EVALUATION only (task 6.1, docs/24): Orthanc is a candidate, not a selected
  # product (OD-14). Synthetic studies only. Start with: docker compose --profile imaging up -d orthanc
  orthanc:
    image: jodogne/orthanc-plugins:1.12.10
    profiles: ["imaging"]
    ports:
      - "127.0.0.1:${ORTHANC_HTTP_PORT:-8142}:8042" # DICOMweb + viewer, localhost only
      - "127.0.0.1:${ORTHANC_DICOM_PORT:-4342}:4242" # DICOM (C-STORE/C-FIND) for modality tests
    volumes:
      - ./infra/imaging/orthanc.local.json:/etc/orthanc/orthanc.json:ro
      - gcare-orthanc:/var/lib/orthanc/db

volumes:
  gcare-pgdata:
  gcare-orthanc:
