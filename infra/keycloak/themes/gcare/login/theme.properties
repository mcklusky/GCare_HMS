# GCare sign-in look (02-UI-UX, compact console style): built on Keycloak's own keycloak.v2 theme,
# CSS only, no template overrides, so Keycloak upgrades keep working. No web fonts or third-party requests.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/gcare.css
# Light only: the brand panel and card are designed and contrast-checked for light.
darkMode=false
