# Local development profile (activated by ./mvnw spring-boot:run). Adds synthetic seed data and
# points sign-in at the local Keycloak from docker-compose.yml. Local-only values; never reuse them.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed-local
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-secret: ${AUTH_CLIENT_SECRET:local-dev-only-not-a-secret}
        provider:
          keycloak:
            issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8180/realms/gcare}

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false} # plain http://localhost

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}

gcare:
  identity:
    post-login-redirect: ${AUTH_POST_LOGIN_REDIRECT:http://localhost:5173/}
    post-logout-redirect: ${AUTH_POST_LOGOUT_REDIRECT:http://localhost:5173/}
