# these values only satisfy the required settings. KeycloakSignInTests uses a real Keycloak.
AUTH_ISSUER_URI: http://keycloak.test.invalid/realms/gcare
AUTH_CLIENT_SECRET: test-only-not-a-secret

springdoc:
  api-docs:
    enabled: true
